<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TikTok Link Checker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔎</text></svg>">
<style>
:root{
  --bg:#eef2f6; --surface:#ffffff; --ink:#14213d; --muted:#5b6678; --line:#d5dce6;
  --accent:#0b5fff; --accent-ink:#ffffff;
  --ok:#0f7b4a; --ok-bg:#e1f4ea; --warn:#8a5a00; --warn-bg:#fbefd0; --bad:#a1262d; --bad-bg:#fbe3e4;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1522; --surface:#17202f; --ink:#e8edf5; --muted:#9aa6b8; --line:#2a3548;
    --accent:#6c9bff; --accent-ink:#0b1220;
    --ok:#6fdba5; --ok-bg:#12382a; --warn:#f0c46a; --warn-bg:#3a2e12; --bad:#ff9ca2; --bad-bg:#40191d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1522; --surface:#17202f; --ink:#e8edf5; --muted:#9aa6b8; --line:#2a3548;
  --accent:#6c9bff; --accent-ink:#0b1220;
  --ok:#6fdba5; --ok-bg:#12382a; --warn:#f0c46a; --warn-bg:#3a2e12; --bad:#ff9ca2; --bad-bg:#40191d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:40px 20px 56px}
h1{font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.1;margin:0 0 8px;letter-spacing:-.02em;font-weight:800}
.lead{color:var(--muted);margin:0 0 24px;max-width:46ch}
.field{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 220px;min-width:0;padding:14px 16px;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px}
input:focus-visible,button:focus-visible,a.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button,a.btn{font:inherit;font-weight:700;padding:14px 20px;border-radius:10px;border:0;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.primary{background:var(--accent);color:var(--accent-ink)}
.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
button:disabled{opacity:.6;cursor:wait}
#result{margin-top:24px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.status{padding:12px 16px;font-weight:700}
.status.ok{background:var(--ok-bg);color:var(--ok)}
.status.warn{background:var(--warn-bg);color:var(--warn)}
.status.bad{background:var(--bad-bg);color:var(--bad)}
.body{padding:16px;display:flex;gap:14px}
.body img{width:96px;height:128px;object-fit:cover;border-radius:8px;background:var(--line);flex:none}
.meta{min-width:0}
.meta h2{font-size:1.05rem;margin:0 0 4px;overflow-wrap:anywhere}
.meta p{margin:0;color:var(--muted);font-size:.95rem}
.note{padding:0 16px 16px;color:var(--muted);font-size:.95rem}
.note p{margin:0 0 10px}
.note ol{margin:0 0 14px;padding-left:20px}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 16px}
footer{margin-top:28px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<main>
  <h1>TikTok link checker</h1>
  <p class="lead">Paste a TikTok video link to see if it’s still available and how to save it. No login needed.</p>

  <div class="field">
    <input id="url" type="url" inputmode="url" placeholder="https://www.tiktok.com/@name/video/…" aria-label="TikTok video link" autocomplete="off">
    <button id="check" class="primary">Check link</button>
  </div>

  <div id="result" aria-live="polite"></div>

  <footer>Downloads only work when the creator has allowed them on TikTok. This page doesn’t bypass that setting.</footer>
</main>

<script>
(function(){
  var input=document.getElementById('url');
  var btn=document.getElementById('check');
  var out=document.getElementById('result');
  var HOSTS=/^(www\.|m\.|vm\.|vt\.)?tiktok\.com$/i;

  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}

  function parse(v){
    try{
      var u=new URL(v.trim());
      if(!/^https?:$/.test(u.protocol)||!HOSTS.test(u.hostname)) return null;
      return u.href;
    }catch(e){return null;}
  }

  var steps='<ol><li>Open the video on TikTok.</li><li>Tap <b>Share</b>.</li><li>If you see <b>Save video</b>, the creator allowed downloads. Tap it.</li><li>No Save option? The creator turned downloads off.</li></ol>';

  function actions(href){
    return '<div class="actions"><a class="btn primary" href="'+esc(href)+'" target="_blank" rel="noopener noreferrer">Open on TikTok</a>'+
           '<button class="ghost" id="again">Check another link</button></div>';
  }

  function show(status,cls,inner){
    out.innerHTML='<div class="card"><div class="status '+cls+'">'+status+'</div>'+inner+'</div>';
    var a=document.getElementById('again');
    if(a) a.onclick=function(){input.value='';out.innerHTML='';input.focus();};
  }

  async function run(){
    var href=parse(input.value);
    if(!href){
      show('That doesn’t look like a TikTok link','bad','<div class="note"><p>Use a link from tiktok.com, vm.tiktok.com or vt.tiktok.com.</p></div>');
      return;
    }
    btn.disabled=true;btn.textContent='Checking…';
    try{
      var ctl=new AbortController();
      var t=setTimeout(function(){ctl.abort();},10000);
      var r=await fetch('https://www.tiktok.com/oembed?url='+encodeURIComponent(href),{signal:ctl.signal});
      clearTimeout(t);
      if(r.ok){
        var d=await r.json();
        var thumb=d.thumbnail_url?'<img src="'+esc(d.thumbnail_url)+'" alt="Video thumbnail">':'';
        show('Video is available','ok',
          '<div class="body">'+thumb+'<div class="meta"><h2>'+esc(d.title||'Untitled video')+'</h2><p>by '+esc(d.author_name||'unknown creator')+'</p></div></div>'+
          '<div class="note"><p>Download permission is set by the creator and can’t be read from outside TikTok. Check it yourself:</p>'+steps+'</div>'+actions(href));
      }else{
        show('Video not available','bad','<div class="note"><p>It may be private, removed, or the link is wrong. Try opening it on TikTok.</p></div>'+actions(href));
      }
    }catch(e){
      show('Couldn’t verify this link here','warn',
        '<div class="note"><p>The check was blocked or timed out. The link format is valid, so you can still open it on TikTok and look for the Save option.</p>'+steps+'</div>'+actions(href));
    }finally{
      btn.disabled=false;btn.textContent='Check link';
    }
  }

  btn.addEventListener('click',run);
  input.addEventListener('keydown',function(e){if(e.key==='Enter')run();});
})();
</script>
</body>
</html>
