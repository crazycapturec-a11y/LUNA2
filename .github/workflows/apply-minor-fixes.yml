name: apply-minor-fixes
on:
  push:
    branches: [fix/minor-bugs]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/minor-bugs
          fetch-depth: 0
      - name: Apply the minor fixes patch
        run: |
          set -euo pipefail
          git config user.name "LUNA fix bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply --ignore-whitespace --verbose minor-fixes.patch
          test "$(git hash-object app/page.tsx)" = "5eb5f7bd02a149f504bdd3d8eda566f1da02ace5"
          test "$(git hash-object services/youtube-worker/server.mjs)" = "d8d5395ebcb4a6a23732bd1e28651ba765890b02"
          test "$(git hash-object tests/youtube-worker.test.mjs)" = "ffbd20d82642758b6e3c6fc038a458533ef223fd"
          git rm -q minor-fixes.patch .github/workflows/apply-minor-fixes.yml
          git add app/page.tsx services/youtube-worker/server.mjs tests/youtube-worker.test.mjs
          git commit -m "fix: toast timer, YouTube audio button, durable history thumbnails, worker ranges"
          git push origin HEAD:fix/minor-bugs
