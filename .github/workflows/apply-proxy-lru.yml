name: apply-proxy-lru
on:
  push:
    branches: [fix/proxy-lru]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/proxy-lru
          fetch-depth: 0
      - name: Apply the proxy allowlist + LRU cache patch
        run: |
          set -euo pipefail
          git config user.name "LUNA fix bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply --ignore-whitespace --verbose proxy-lru-fixes.patch
          test "$(git hash-object app/api/proxy/route.ts)" = "dc40bc83cd88751e92579a1560a577d46eb86091"
          test "$(git hash-object app/lib/youtube.ts)" = "6359de845fef2ecdc2e50ddc7179587bca4bce2b"
          test "$(git hash-object tests/proxy-referer.spec.mjs)" = "f3c3c0c63ad1195b3708df07ccb13166857314ee"
          test "$(git hash-object tests/youtube.test.mjs)" = "7dbb7d1fc06d26f98e245ae593443ef802d5e2a6"
          git rm -q proxy-lru-fixes.patch .github/workflows/apply-proxy-lru.yml
          git add app tests
          git commit -m "fix: evict the least recently used stream, and relay media hosts only"
          git push origin HEAD:fix/proxy-lru
